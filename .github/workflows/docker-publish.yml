name: Build and Publish Docker Image

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

env:
  DOCKERHUB_IMAGE: matrixise/rmm-tracker

jobs:
  build-and-push:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      # `type=gha` caches image *layers* only. It does not carry the contents of
      # the Dockerfile's `--mount=type=cache` mounts (`id=go-mod`, `id=go-build`)
      # between runs, so `go build` -- whose layer is invalidated by `COPY . .` on
      # every commit -- always recompiles from a cold Go build cache.
      #
      # Persisting those mounts needs reproducible-containers/buildkit-cache-dance
      # to snapshot them into actions/cache. Measured 2026-08-20 and deliberately
      # NOT adopted: it costs more than it saves at this project's size.
      #
      #   mount      on-disk   files    zstd
      #   go-build     263 MB   2 878    59 MB
      #   go-mod       393 MB  11 596   108 MB
      #
      #   dance overhead (local, buildx builder pinned to 4 CPUs)
      #     both mounts       inject 25s + extract 51s = 76s, 167 MB cache
      #     go-build only     inject 11s + extract 20s = 31s,  59 MB cache
      #
      # The dance is verified to work here -- auto-discovery reads this repo's
      # Dockerfile and derives both mounts from their `id=`, and a build on the
      # injected builder dropped from 70.6s to 1.7s locally. But the saving is
      # capped by how long the compile actually takes on a runner, and this
      # project compiles fast: `go build` is 28.1s in run 32404065239. Even the
      # cheap variant (go-build only) spends ~31s of inject+extract, plus the
      # actions/cache round trip, to save ~25s. Caching go-mod alone is the worst
      # trade of all -- the largest mount (11.6k files) for the ~10s of module
      # download it avoids.
      #
      # Extraction cannot be skipped in the common case: `skip-extraction` only
      # fires on an exact cache-key hit, and the premise here is that the source
      # changed. Revisit if the dependency tree grows enough to push `go build`
      # past ~90s, which is where the inject+extract overhead starts to pay off.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.event.workflow_run.head_branch }}
            GIT_BRANCH=${{ github.event.workflow_run.head_branch }}
            GIT_COMMIT=${{ github.event.workflow_run.head_sha }}
            BUILD_TIME=${{ github.event.workflow_run.updated_at }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "RMM Tracker - Monitor ERC-20 token balances on Gnosis Chain"
          readme-filepath: ./README.md
