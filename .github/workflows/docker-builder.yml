name: Build and Publish Builder Image

# Manual/ad-hoc rebuild of the builder base image (which pre-downloads all Go
# modules). docker-publish.yml already rebuilds and pushes this image on
# every deploy (see its build-builder job), so the main Dockerfile always has
# a fresh, matching image to build FROM without a cross-workflow race. Use
# this workflow when you want to refresh the published image on its own,
# without cutting a full application release.

on:
  workflow_dispatch:

env:
  BUILDER_IMAGE: matrixise/rmm-tracker-builder

jobs:
  build-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Kept in sync with docker-publish.yml's build-builder job: read from
      # Dockerfile.builder's own FROM line, not go.mod's `go` directive,
      # since those can legitimately diverge.
      - name: Extract Go version from Dockerfile.builder
        id: goversion
        run: |
          GO_VERSION=$(grep 'FROM' Dockerfile.builder | grep -oE 'golang:[0-9]+\.[0-9]+' | cut -d: -f2)
          echo "version=${GO_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push builder image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.builder
          # Builder image only needs to run on the CI host architecture (amd64).
          # The main Dockerfile uses --platform=$BUILDPLATFORM so arm64 builds
          # also pull the amd64 builder image and cross-compile natively.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}:go${{ steps.goversion.outputs.version }}
            ${{ env.BUILDER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
